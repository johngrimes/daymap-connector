apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "daymap-connector.fullname" . }}
  labels:
    {{- include "daymap-connector.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "daymap-connector.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- if not .Values.secrets.existingSecret }}
        checksum/config: {{ .Values.secrets.tokenSigningSecret | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "daymap-connector.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: connector
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: PORT
              value: "3000"
            - name: PUBLIC_URL
              value: {{ required "publicUrl is required, e.g. https://daymap.example.com" .Values.publicUrl | trimSuffix "/" | quote }}
            - name: DAYMAP_URL
              value: {{ required "daymap.url is required, e.g. https://yourschool.eq.daymap.net" .Values.daymap.url | trimSuffix "/" | quote }}
            - name: ALLOWED_DAYMAP_USERS
              value: {{ required "connector.allowedDaymapUsers must list at least one Daymap username" (join "," .Values.connector.allowedDaymapUsers) | quote }}
            - name: CONNECTOR_TITLE
              value: {{ .Values.connector.title | quote }}
            - name: TRUST_PROXY
              value: {{ .Values.connector.trustProxy | quote }}
            {{- with .Values.connector.allowedRedirectUris }}
            - name: OAUTH_ALLOWED_REDIRECT_URIS
              value: {{ join "," . | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ include "daymap-connector.secretName" . }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
