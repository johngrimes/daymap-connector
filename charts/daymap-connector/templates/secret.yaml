{{- if not .Values.secrets.existingSecret }}
{{- $name := include "daymap-connector.fullname" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $signing := .Values.secrets.tokenSigningSecret }}
{{- if not $signing }}
{{- if and $existing (index $existing.data "TOKEN_SIGNING_SECRET") }}
{{- $signing = index $existing.data "TOKEN_SIGNING_SECRET" | b64dec }}
{{- else }}
{{- $signing = randAlphaNum 48 }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "daymap-connector.labels" . | nindent 4 }}
type: Opaque
stringData:
  TOKEN_SIGNING_SECRET: {{ $signing | quote }}
{{- end }}
