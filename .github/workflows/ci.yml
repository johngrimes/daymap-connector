name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0
      - name: Lint
        run: >
          helm lint charts/daymap-connector
          --set publicUrl=https://daymap.example.com
          --set daymap.url=https://school.example
          --set 'connector.allowedDaymapUsers={parent}'
      - name: Render (generated secret, ingress)
        run: >
          helm template ci charts/daymap-connector
          --set publicUrl=https://daymap.example.com
          --set daymap.url=https://school.example
          --set 'connector.allowedDaymapUsers={parent,other.parent}'
          --set ingress.enabled=true,ingress.className=nginx
          --set 'connector.allowedRedirectUris[0]=https://claude.ai/api/mcp/auth_callback'
      - name: Render (existing secret)
        run: >
          helm template ci charts/daymap-connector
          --set publicUrl=https://daymap.example.com
          --set daymap.url=https://school.example
          --set secrets.existingSecret=daymap
          --set 'connector.allowedDaymapUsers={parent}'
      - name: Refuse an empty allowlist
        run: >
          ! helm template ci charts/daymap-connector
          --set publicUrl=https://daymap.example.com
          --set daymap.url=https://school.example

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=ref,event=branch
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, chart, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0
      - name: Package Helm chart
        run: helm package charts/daymap-connector
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            Image `ghcr.io/${{ github.repository }}:${{ github.ref_name }}` (without the leading `v`); Helm chart attached below. See the README for setup.
          files: |
            daymap-connector-*.tgz
